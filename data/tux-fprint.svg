<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300">
  <!--
    Tux for greeter-fprint's fingerprint panel.

    Flat, modern, friendly. Drawn to leave the raised left flipper (viewer's
    left) empty: the panel composites the Mint logo - or the "Passwort:"
    sign - into that hand at the anchor point declared in
    fingerprint-panel.vala (HAND_X / HAND_Y, as fractions of this viewBox).
    Keep that anchor in sync if the flipper ever moves.
  -->
  <defs>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecef"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc93f"/>
      <stop offset="1" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc93f"/>
      <stop offset="1" stop-color="#e8890c"/>
    </linearGradient>
  </defs>

  <!-- feet -->
  <ellipse cx="86"  cy="276" rx="40" ry="17" fill="url(#foot)" transform="rotate(-9 86 276)"/>
  <ellipse cx="176" cy="276" rx="40" ry="17" fill="url(#foot)" transform="rotate(9 176 276)"/>

  <!-- body -->
  <path d="M130 44
           c 52 0 84 44 84 104
           c 0 62 -30 116 -84 116
           c -54 0 -84 -54 -84 -116
           c 0 -60 32 -104 84 -104 z"
        fill="#26282b"/>

  <!-- belly -->
  <path d="M131 108
           c 38 0 60 34 60 76
           c 0 40 -22 72 -60 72
           c -38 0 -60 -32 -60 -72
           c 0 -42 22 -76 60 -76 z"
        fill="url(#belly)"/>

  <!-- right flipper (viewer's right): tucked along the body, tapering down -->
  <path d="M196 142
           c 14 10 22 36 20 66
           c -1 18 -8 30 -15 30
           c -8 0 -12 -14 -12 -32
           c 0 -22 1 -46 7 -64 z"
        fill="#1f2124"/>

  <!-- head -->
  <circle cx="130" cy="80" r="60" fill="#26282b"/>

  <!-- face patch -->
  <ellipse cx="130" cy="94" rx="46" ry="40" fill="#ffffff"/>

  <!-- eyes -->
  <ellipse cx="109" cy="72" rx="13" ry="16" fill="#ffffff"/>
  <ellipse cx="151" cy="72" rx="13" ry="16" fill="#ffffff"/>
  <circle cx="112" cy="75" r="7" fill="#26282b"/>
  <circle cx="148" cy="75" r="7" fill="#26282b"/>
  <circle cx="114.5" cy="72" r="2.4" fill="#ffffff"/>
  <circle cx="150.5" cy="72" r="2.4" fill="#ffffff"/>

  <!-- beak, curved upward at the corners: the smile -->
  <path d="M104 100
           c 8 -7 44 -7 52 0
           c 4 6 -2 16 -12 20
           c -10 4 -22 4 -30 -1
           c -9 -5 -13 -14 -10 -19 z"
        fill="url(#beak)"/>
  <path d="M108 112 c 8 8 36 8 44 0"
        fill="none" stroke="#d9800a" stroke-width="2.6" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="88"  cy="104" rx="9" ry="6" fill="#ffb3b3" opacity="0.55"/>
  <ellipse cx="172" cy="104" rx="9" ry="6" fill="#ffb3b3" opacity="0.55"/>

  <!-- raised left flipper (viewer's left): the arm that holds the logo.
       Drawn last so it sits beside the head rather than behind it; the
       rounded tip is the "hand" the panel composites the logo onto, at
       HAND_X/HAND_Y (fractions of this viewBox) in fingerprint-panel.vala. -->
  <path d="M92 186
           c -16 -18 -30 -44 -34 -64
           c -3 -16 4 -27 14 -27
           c 11 0 19 12 25 28
           c 6 16 12 34 16 48
           c -5 12 -13 20 -21 15 z"
        fill="#24262a"/>
</svg>
