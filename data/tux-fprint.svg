<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" width="260" height="300">
  <!--
    tux-fprint.svg - Tux holding up the Mint logo, for greeter-fprint.

    Copyright (C) 2026 soul-inferno <nofunction@gmx.net>
    Licensed under the GNU General Public License version 3, like the rest of
    this fork. See COPYING.

    This is an original drawing, not traced from or derived from any existing
    file. It depicts Tux, the Linux mascot created by Larry Ewing in 1996 with
    The GIMP - credit to him for the character.

    The Mint logo is NOT part of this file. The panel composites the system's
    own installed icon (linuxmint-logo-badge-symbolic) into Tux's hand at
    runtime, so no Linux Mint trademark is redistributed by this repository.

    NOTE: this block sits *inside* the root element on purpose. Above it,
    gdk-pixbuf stops recognising the file as an SVG at all: its format
    sniffing wants to see <svg near the start of the file, and a comment
    this long pushes it out of range. librsvg parses it either way, which
    is exactly what made that breakage easy to miss.
  -->
  <!--
    Tux for greeter-fprint's fingerprint panel.

    Flat, modern, friendly. Drawn to leave the raised left flipper (viewer's
    left) empty: the panel composites the Mint logo - or the "Passwort:"
    sign - into that hand at the anchor point declared in
    fingerprint-panel.vala (HAND_X / HAND_Y, as fractions of this viewBox).
    Keep that anchor in sync if the flipper ever moves.
  -->
  <defs>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecef"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc93f"/>
      <stop offset="1" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc93f"/>
      <stop offset="1" stop-color="#e8890c"/>
    </linearGradient>
  </defs>

  <!-- feet -->
  <ellipse cx="86"  cy="276" rx="40" ry="17" fill="url(#foot)" transform="rotate(-9 86 276)"/>
  <ellipse cx="176" cy="276" rx="40" ry="17" fill="url(#foot)" transform="rotate(9 176 276)"/>

  <!-- body -->
  <path d="M130 44
           c 52 0 84 44 84 104
           c 0 62 -30 116 -84 116
           c -54 0 -84 -54 -84 -116
           c 0 -60 32 -104 84 -104 z"
        fill="#26282b"/>

  <!-- belly -->
  <path d="M131 108
           c 38 0 60 34 60 76
           c 0 40 -22 72 -60 72
           c -38 0 -60 -32 -60 -72
           c 0 -42 22 -76 60 -76 z"
        fill="url(#belly)"/>

  <!-- right flipper (viewer's right): tucked along the body, tapering down -->
  <path d="M196 142
           c 14 10 22 36 20 66
           c -1 18 -8 30 -15 30
           c -8 0 -12 -14 -12 -32
           c 0 -22 1 -46 7 -64 z"
        fill="#1f2124"/>

  <!-- head -->
  <circle cx="130" cy="80" r="60" fill="#26282b"/>

  <!-- face patch -->
  <ellipse cx="130" cy="94" rx="46" ry="40" fill="#ffffff"/>

  <!-- eyes -->
  <ellipse cx="109" cy="72" rx="13" ry="16" fill="#ffffff"/>
  <ellipse cx="151" cy="72" rx="13" ry="16" fill="#ffffff"/>
  <circle cx="112" cy="75" r="7" fill="#26282b"/>
  <circle cx="148" cy="75" r="7" fill="#26282b"/>
  <circle cx="114.5" cy="72" r="2.4" fill="#ffffff"/>
  <circle cx="150.5" cy="72" r="2.4" fill="#ffffff"/>

  <!-- beak, curved upward at the corners: the smile -->
  <path d="M104 100
           c 8 -7 44 -7 52 0
           c 4 6 -2 16 -12 20
           c -10 4 -22 4 -30 -1
           c -9 -5 -13 -14 -10 -19 z"
        fill="url(#beak)"/>
  <path d="M108 112 c 8 8 36 8 44 0"
        fill="none" stroke="#d9800a" stroke-width="2.6" stroke-linecap="round"/>

  <!-- raised left flipper (viewer's left).

       Anatomy first: on a penguin seen head-on both flippers leave the body at
       the same height, one either side of the shoulder, and both sit in the
       dark band between the body outline and the white front - never on the
       white itself. The right flipper attaches at (196,142); mirrored across
       this 260-wide viewBox that is (64,142), and this one starts there.

       The white front's left edge runs x=81 at y=139, x=77 at y=149, x=74 at
       y=160 (computed from the belly path, not guessed), so this flipper's
       inner edge stays at x<=66 through its whole root - clear of the white by
       a good ten units at every height.

       Same fill as the right flipper, #1f2124: they are the same body part and
       should not be two different colours. Below the shoulder that makes it
       merge into the body, exactly as the right one does; what reads as the
       raised flipper is the part above, which leaves the body outline entirely.

       The panel composites the Mint logo just beyond the tip, at HAND_X/HAND_Y
       (fractions of this viewBox); keep those in sync. -->
  <path d="M64 140
           C 54 116, 40 88, 33 66
           C 28 51, 45 42, 54 57
           C 61 70, 66 106, 68 140
           C 70 156, 60 166, 54 158
           C 50 152, 58 148, 64 140 Z"
        fill="#1f2124"/>
</svg>
